[tool.poetry]
name = "coursework-num-1"
version = "0.1.0"
description = ""
authors = ["Your Name <you@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.13"
flake8 = "^7.3.0"
isort = "^7.0.0"
mypy = "^1.18.2"
pytest-cov = "^7.0.0"
pytest-coverage = "^0.0"
black = "^25.11.0"
poetry-core = "^2.2.1"
anyio = "==4.10.0"
build = "==1.3.0"
cachecontrol = "==0.14.3"
certifi = "==2025.8.3"
charset-normalizer = "==3.4.3"
cleo = "==2.1.0"
crashtest = "==0.4.1"
distlib = "==0.4.0"
dulwich = "==0.22.8"
fastjsonschema = "==2.21.2"
filelock = "==3.19.1"
findpython = "==0.6.3"
h11 = "==0.16.0"
httpcore = "==1.0.9"
httpx = "==0.28.1"
idna = "==3.10"
installer = "==0.7.0"
jaraco-classes = "==3.4.0"
jaraco-context = "==6.0.1"
jaraco-functools = "==4.3.0"
keyring = "==25.6.0"
more-itertools = "==10.7.0"
msgpack = "==1.1.1"
pbs-installer = "==2025.8.28"
pkginfo = "==1.12.1.2"
requests-toolbelt = "==1.0.0"
zstandard = "==0.24.0"
virtualenv = "==20.32.0"
trove-classifiers = "==2025.8.26.11"
tomlkit = "==0.13.3"
shellingham = "==1.5.4"
python-dotenv = "^1.2.1"

[tool.black]
line-length = 119
exclude = '''
(
  /(
      \.eggs         # Исключить несколько общих каталогов
    | \.git          # в корне проекта
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | dist
  )/
  | foo.py           # Также отдельно исключить файл с именем foo.py
                     # в корне проекта
)
'''

[tool.isort]
line_length = 119

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
